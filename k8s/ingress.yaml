# One public entry point. The Ingress controller (Traefik, installed by
# Terraform) routes each request by its path. No path rewriting: every
# service already serves its routes under its own prefix.
#
#   /api/auth, /api/projects            -> auth-service
#   /api/v2, /deepscan, /files, /toolkit -> ai-service
#   everything else                      -> frontend
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: docling
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: docling-security-headers@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - { path: /api/projects, pathType: Prefix, backend: { service: { name: auth-service, port: { number: 3000 } } } }
          - { path: /api/v2,       pathType: Prefix, backend: { service: { name: ai-service,   port: { number: 8000 } } } }
          - { path: /deepscan,     pathType: Prefix, backend: { service: { name: ai-service,   port: { number: 8000 } } } }
          - { path: /files,        pathType: Prefix, backend: { service: { name: ai-service,   port: { number: 8000 } } } }
          - { path: /toolkit,      pathType: Prefix, backend: { service: { name: ai-service,   port: { number: 8000 } } } }
          - { path: /,             pathType: Prefix, backend: { service: { name: frontend,     port: { number: 80 } } } }
---
# Login/sign-up get their own Ingress so a rate limit can apply to them only
# (slows down password guessing).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: docling-auth
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: docling-security-headers@kubernetescrd,docling-auth-ratelimit@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - { path: /api/auth, pathType: Prefix, backend: { service: { name: auth-service, port: { number: 3000 } } } }
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: security-headers
spec:
  headers:
    contentTypeNosniff: true
    frameDeny: true
    referrerPolicy: strict-origin-when-cross-origin
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: auth-ratelimit
spec:
  rateLimit:
    average: 60          # requests per minute per visitor ...
    period: 1m
    burst: 30            # ... with short bursts allowed
    sourceCriterion:
      # Behind Cloudflare every request comes from the tunnel pod, so group
      # visitors by the real client IP Cloudflare passes along.
      requestHeaderName: CF-Connecting-IP
