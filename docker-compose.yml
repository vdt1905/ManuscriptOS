# =============================================================================
# Docling AI — local development with Docker Compose
# =============================================================================
# Three microservices plus MongoDB, each in its own container:
#   frontend      React app served by nginx           http://localhost:5173
#   auth-service  Node/Express: users, login, projects http://localhost:3000
#   ai-service    Python/FastAPI: AI features          http://localhost:${BACKEND_AI_PORT}
#   mongo         database (used when MONGO_URI is unset in .env)
#
#     docker compose up --build
#
# Secrets come from the repo-root .env file (never baked into an image).
# For the Kubernetes deployment see DEVOPS.md.
# =============================================================================

services:

  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  auth-service:
    build: ./backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      MONGO_URI: ${MONGO_URI:-mongodb://mongo:27017/hackamined}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
    depends_on:
      mongo:
        condition: service_healthy

  ai-service:
    build: ./backend_ai
    restart: unless-stopped
    ports:
      - "${BACKEND_AI_PORT:-8000}:8000"
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LATEX_MODEL: ${LATEX_MODEL:-openai/gpt-oss-120b}
      LLM_PROVIDER: ${LLM_PROVIDER:-groq}
      LLM_MODEL: ${LLM_MODEL:-openai/gpt-oss-120b}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      REQUIRE_AUTH: ${REQUIRE_AUTH:-false}
    volumes:
      - ai-data:/app/backend_ai/data             # chat history, DocBot documents
      - ai-output:/app/backend_ai/deepscan/output

  frontend:
    build:
      context: ./frontend
      args:
        # The browser calls the two APIs on the ports published above.
        VITE_EXPRESS_URL: http://localhost:3000
        VITE_AI_URL: http://localhost:${BACKEND_AI_PORT:-8000}
    restart: unless-stopped
    ports:
      - "5173:8080"
    depends_on:
      - auth-service
      - ai-service

volumes:
  mongo-data:
  ai-data:
  ai-output:
