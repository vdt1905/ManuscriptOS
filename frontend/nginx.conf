# Serves the built React app. This is only a static file server: routing to
# the APIs is done by the Kubernetes Ingress, not here.
server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Basic security headers on every response.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Single-page app: any unknown path returns index.html and React Router
    # shows the right page.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Build output has content hashes in the file names, so it can be
    # cached for a long time.
    location /assets/ {
        expires 1y;
    }
}
