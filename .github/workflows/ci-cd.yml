# =============================================================================
# CI/CD pipeline for Docling AI
#
#   test ─────┐
#   security ─┼─▶ build (3 images, scanned, pushed) ─▶ k8s-staging ─▶ deploy-aws
#   iac ──────┘                                       (Kubernetes)    (production)
#
# Pull requests run everything up to "build" (no push, no deploy).
# Pushes to main also:
#   k8s-staging  deploy the new images to a throw-away Kubernetes cluster
#                (created by the project's Terraform) and smoke-test them
#   deploy-aws   if that passed: release the same images to AWS and
#                smoke-test the public HTTPS link
# deploy-aws runs once the AWS repository variables are set (see DEVOPS.md).
# =============================================================================
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least privilege: jobs get only what they need (some jobs add more below).
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TRIVY_VERSION: "0.76.1"
  GITLEAKS_VERSION: "8.30.1"
  HADOLINT_VERSION: "v2.15.1"
  KIND_VERSION: "v0.33.0"

jobs:
  # ── CI: build and unit-test every service ─────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      - name: frontend — install, unit tests, production build
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build

      - name: auth-service — install, syntax check
        working-directory: backend
        run: |
          npm ci
          find . -name '*.js' -not -path './node_modules/*' -print0 | xargs -0 -n1 node --check

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend_ai/requirements.txt

      - name: ai-service — install, unit tests
        run: |
          pip install -r backend_ai/requirements.txt pytest
          python -m pytest backend_ai/tests -q

  # ── DevSecOps: security gates ─────────────────────────────────────────────
  security:
    name: Security scans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the secret scan checks the whole history

      - name: Install scanners
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar xz gitleaks
          curl -sSfL "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" | tar xz trivy
          curl -sSfL -o hadolint "https://github.com/hadolint/hadolint/releases/download/${HADOLINT_VERSION}/hadolint-linux-x86_64"
          chmod +x gitleaks trivy hadolint
          sudo mv gitleaks trivy hadolint /usr/local/bin/

      - name: Secrets — Gitleaks (whole git history)
        run: gitleaks git . --redact --verbose

      - name: Secrets — Trivy (current files)
        run: trivy fs --scanners secret --exit-code 1 --quiet .

      - name: Misconfigurations — Trivy (Dockerfiles, Kubernetes, Terraform/AWS)
        run: trivy fs --scanners misconfig --severity HIGH,CRITICAL --exit-code 1 --quiet .

      - name: Vulnerable dependencies — Trivy (block fixable CRITICAL)
        run: trivy fs --scanners vuln --severity CRITICAL --ignore-unfixed --exit-code 1 --quiet .

      - name: Dockerfile lint — Hadolint
        run: |
          for f in frontend/Dockerfile backend/Dockerfile backend_ai/Dockerfile; do
            echo "== $f"; hadolint --ignore DL3008 --failure-threshold error "$f"
          done

      - name: Python code security — Bandit (block high severity)
        run: pipx run bandit -r backend_ai -x backend_ai/tests -q -lll -iii

      - name: npm audit (block critical)
        run: |
          (cd frontend && npm audit --audit-level=critical --omit=dev)
          (cd backend && npm audit --audit-level=critical --omit=dev)

      - name: Full vulnerability report (all severities, for review)
        if: always()
        run: trivy fs --scanners vuln,misconfig --quiet --format table --output trivy-report.txt .

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: security-report
          path: trivy-report.txt

  # ── IaC: validate both Terraform stacks, the manifests and deploy files ───
  iac:
    name: Validate IaC
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false
      - name: terraform fmt / validate (infra/kind and infra/aws)
        run: |
          terraform fmt -check -recursive infra
          for stack in infra/kind infra/aws; do
            echo "== $stack"
            terraform -chdir="$stack" init -backend=false -input=false
            terraform -chdir="$stack" validate
          done
      - name: Render Kubernetes manifests (kustomize)
        run: kubectl kustomize k8s > /dev/null && echo "k8s manifests render OK"
      - name: Check the AWS server files (compose file, shell scripts)
        env:
          IMAGE_OWNER: check
          IMAGE_TAG: check
          MONGO_URI: check
          JWT_SECRET_KEY: check
        run: |
          docker compose -f deploy/aws/docker-compose.yml config --quiet
          bash -n deploy/aws/deploy.sh
          bash -n infra/aws/user_data.sh
          echo "AWS server files OK"

  # ── Build, scan and publish the three container images ────────────────────
  build:
    name: Build image (${{ matrix.service }})
    needs: [test, security, iac]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: frontend
            context: frontend
          - service: auth-service
            context: backend
          - service: ai-service
            context: backend_ai
    steps:
      - uses: actions/checkout@v7

      - name: Free disk space (the AI image is large)
        if: matrix.service == 'ai-service'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/docling-${{ matrix.service }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          load: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:latest
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Scan image — Trivy (block fixable CRITICAL)
        run: |
          curl -sSfL "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" | tar xz trivy
          ./trivy image --scanners vuln --severity CRITICAL --ignore-unfixed --exit-code 1 --quiet \
            "${{ steps.image.outputs.name }}:${{ github.sha }}"

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        if: github.event_name != 'pull_request'
        run: |
          docker push "${{ steps.image.outputs.name }}:${{ github.sha }}"
          docker push "${{ steps.image.outputs.name }}:latest"

  # ── CD stage 1: staging on Kubernetes (throw-away cluster) ────────────────
  k8s-staging:
    name: Staging on Kubernetes
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7

      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: Install kind
        run: |
          curl -sSfLo kind "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64"
          chmod +x kind && sudo mv kind /usr/local/bin/kind

      - name: Provision the cluster with Terraform (the same code as on the laptop)
        working-directory: infra/kind
        env:
          TF_VAR_groq_api_key: ${{ secrets.GROQ_API_KEY }}
        run: |
          terraform init -input=false
          terraform apply -auto-approve -input=false
          kind export kubeconfig --name docling

      - name: Load the images this pipeline built
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          for s in frontend auth-service ai-service; do
            docker pull "ghcr.io/$owner/docling-$s:${{ github.sha }}"
            docker tag "ghcr.io/$owner/docling-$s:${{ github.sha }}" "docling/$s:local"
          done
          kind load docker-image docling/frontend:local docling/auth-service:local docling/ai-service:local --name docling

      - name: Deploy the application
        run: |
          kubectl apply -k k8s
          kubectl -n docling rollout status statefulset/mongo --timeout=300s
          kubectl -n docling rollout status deployment/auth-service --timeout=300s
          kubectl -n docling rollout status deployment/frontend --timeout=300s
          kubectl -n docling rollout status deployment/ai-service --timeout=600s
          kubectl -n docling get pods,svc,ingress,hpa

      - name: Smoke test through the Ingress
        run: bash scripts/smoke-test.sh http://localhost:8080

      - name: Diagnostics
        if: failure()
        run: |
          kubectl -n docling get pods -o wide || true
          kubectl -n docling describe pods || true
          for d in auth-service ai-service frontend; do kubectl -n docling logs "deploy/$d" --tail=80 || true; done
          kubectl -n docling logs statefulset/mongo --tail=40 || true

      - name: Tear down
        if: always()
        working-directory: infra/kind
        run: terraform destroy -auto-approve -input=false || true

  # ── CD stage 2: production on AWS ─────────────────────────────────────────
  # No AWS keys are stored in GitHub: the job proves its identity with a
  # short-lived OpenID Connect token and receives temporary credentials for
  # the deploy role created by infra/aws (allowed only for this environment).
  deploy-aws:
    name: Deploy to AWS (production)
    needs: k8s-staging
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.AWS_ROLE_ARN != ''
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.APP_URL }}
    permissions:
      contents: read
      packages: read # pull the website image; short-lived registry login for the server
      id-token: write # request the OpenID Connect token for AWS
    env:
      INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
      BUCKET: ${{ vars.FRONTEND_BUCKET }}
      DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
      APP_URL: ${{ vars.APP_URL }}
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - name: Get temporary AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Release the APIs on EC2 (via AWS Systems Manager, no SSH)
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          # The command run on the server: wait for first-boot setup, write the
          # compose file and deploy script, log in to the registry with this
          # job's short-lived token, deploy this commit's images, log out.
          jq -n \
            --arg compose "$(base64 -w0 deploy/aws/docker-compose.yml)" \
            --arg script "$(base64 -w0 deploy/aws/deploy.sh)" \
            --arg owner "$owner" --arg tag "$GITHUB_SHA" \
            --arg user "$GITHUB_ACTOR" --arg token "$GHCR_TOKEN" \
            '{executionTimeout: ["1200"], commands: [
              "set -euo pipefail",
              "cloud-init status --wait > /dev/null || true",
              "mkdir -p /opt/docling && cd /opt/docling",
              "echo \($compose) | base64 -d > docker-compose.yml",
              "echo \($script) | base64 -d > deploy.sh && chmod 700 deploy.sh",
              "echo \($token) | docker login ghcr.io -u \($user) --password-stdin",
              "rc=0; ./deploy.sh \($owner) \($tag) || rc=$?; docker logout ghcr.io; exit $rc"
            ]}' > ssm-command.json

          id=$(aws ssm send-command --instance-ids "$INSTANCE_ID" \
                 --document-name AWS-RunShellScript --comment "deploy ${GITHUB_SHA::7}" \
                 --parameters file://ssm-command.json --query Command.CommandId --output text)
          rm ssm-command.json
          echo "Systems Manager command: $id"

          status=Pending
          for _ in $(seq 1 120); do
            sleep 10
            status=$(aws ssm get-command-invocation --command-id "$id" --instance-id "$INSTANCE_ID" \
                       --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in Pending|InProgress|Delayed) ;; *) break ;; esac
          done
          aws ssm get-command-invocation --command-id "$id" --instance-id "$INSTANCE_ID" \
            --query '[StandardOutputContent,StandardErrorContent]' --output text || true
          echo "Result: $status"
          [ "$status" = Success ]

      - name: Publish the website to S3 (the same image that was scanned)
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/docling-frontend:$GITHUB_SHA"
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker pull "$image"
          cid=$(docker create "$image")
          docker cp "$cid:/usr/share/nginx/html" site
          docker rm "$cid"
          # Hashed bundles never change: cache them for a year. Everything
          # else (index.html) is revalidated, so a release shows up at once.
          aws s3 sync site/assets "s3://$BUCKET/assets" --cache-control "public,max-age=31536000,immutable"
          aws s3 sync site "s3://$BUCKET" --exclude "assets/*" --delete --cache-control "no-cache"

      - name: Refresh the CDN (CloudFront invalidation)
        run: |
          inv=$(aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" \
                  --paths "/*" --query Invalidation.Id --output text)
          aws cloudfront wait invalidation-completed --distribution-id "$DISTRIBUTION_ID" --id "$inv"

      - name: Smoke test the public link
        run: bash scripts/smoke-test.sh "$APP_URL"
